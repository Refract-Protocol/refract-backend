name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Build
        run: npm run build --if-present

      - name: Test
        run: npm test --if-present

      - name: Verify OpenAPI spec is up to date
        run: |
          npm run openapi:generate
          if ! git diff --exit-code -- openapi.json; then
            echo "::error::openapi.json is out of date. Run 'npm run openapi:generate' and commit the result."
            exit 1
          fi
